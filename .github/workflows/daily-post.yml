name: Daily Social Post

on:
  schedule:
    # 07:00 UTC ≈ 08:00 or 09:00 Europe/Berlin depending on daylight saving.
    # Adjust if you want a different posting time.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Configure git identity
        run: |
          git config user.name "buchalik-content-bot"
          git config user.email "actions@github.com"

      - name: Publish next queue item
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: npm run publish

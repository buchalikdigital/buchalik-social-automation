<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
{{FONTS_CSS}}

/* Lighter Inter weights live here rather than in _fonts.css: the shared file
   is loaded by every template, and several of those declare weight 400 while
   relying on the 600 fallback. Scoping these faces keeps this the only
   graphic that changes. */
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 200;
  src: url(data:font/ttf;base64,{{INTER_200}}) format('truetype');
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400;
  src: url(data:font/ttf;base64,{{INTER_400}}) format('truetype');
}

/* This graphic deliberately drops the dark-gold brand canvas. It is a scene,
   not a brand surface: a phone lighting a dark room at night, so everything
   reads cold. The single warm element is the closing line — the one thing in
   the frame that belongs to Buchalik rather than to the customer's 3am. */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

.canvas {
  position: relative; overflow: hidden;
  width: 1080px; height: 1080px;
  background: #07080A;
  font-family: 'Inter', sans-serif;
}

/* Cold light spilling off the screen — the only illumination in the frame. */
.screenglow {
  position: absolute; left: 50%; top: 36%;
  width: 1240px; height: 1080px; transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center, rgba(158,192,242,0.30), rgba(122,158,208,0.10) 44%, transparent 70%);
  filter: blur(60px); pointer-events: none;
}
.screenglow-tight {
  position: absolute; left: 50%; top: 59%;
  width: 860px; height: 340px; transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center, rgba(184,210,248,0.22), transparent 72%);
  filter: blur(50px); pointer-events: none;
}

.lock {
  position: absolute; left: 0; right: 0; top: 232px;
  display: flex; flex-direction: column; align-items: center;
}

.weekday {
  margin: 0 0 14px;
  font: 400 17px/1 'Inter', sans-serif;
  letter-spacing: 0.44em; text-transform: uppercase;
  color: rgba(200,217,242,0.42);
}

.time {
  margin: 0;
  font: 200 208px/1 'Inter', sans-serif;
  letter-spacing: -0.035em;
  color: #EDF3FC;
  font-variant-numeric: tabular-nums;
}

/* Search field, styled as a neutral input rather than any real product's UI. */
.searchbar {
  margin-top: 92px;
  width: 748px; height: 98px; border-radius: 49px;
  display: flex; align-items: center; gap: 20px; padding: 0 34px;
  background: rgba(226,238,255,0.055);
  border: 1px solid rgba(186,212,250,0.16);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
}
.searchbar svg { flex-shrink: 0; opacity: 0.5; }
.query {
  font: 400 29px/1 'Inter', sans-serif;
  color: rgba(228,238,252,0.78);
  letter-spacing: -0.005em;
}
.caret {
  width: 2px; height: 34px; margin-left: -12px;
  background: rgba(232,240,253,0.85);
}

/* Bottom block sits left, not centred — the previous graphics were all
   centre-stacked, and breaking that is half of why this one reads differently. */
.payoff {
  position: absolute; left: 84px; bottom: 168px; margin: 0;
  font-family: 'Playfair Display', serif; font-weight: 700;
  font-size: 52px; line-height: 1.22;
  color: #F2F6FD;
}
.payoff em {
  font-style: italic; font-weight: 600;
  color: #E8C875;
}

.url {
  position: absolute; right: 84px; bottom: 84px;
  font: 400 17px/1 'Inter', sans-serif;
  letter-spacing: 0.05em;
  color: rgba(200,217,242,0.32);
}
</style>
</head>
<body>
<div class="canvas">
  <div class="screenglow"></div>
  <div class="screenglow-tight"></div>

  <div class="lock">
    <p class="weekday">{{WEEKDAY}}</p>
    <p class="time">{{TIME}}</p>

    <div class="searchbar">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#DCE8FA" stroke-width="1.8">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35" stroke-linecap="round"/>
      </svg>
      <span class="query">{{QUERY}}</span>
      <span class="caret"></span>
    </div>
  </div>

  <p class="payoff">{{PAYOFF}}</p>
  <span class="url">buchalik-websites.com</span>
</div>
</body>
</html>

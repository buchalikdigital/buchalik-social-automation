<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
{{BASE_CSS}}

.canvas { width: 1200px; height: 630px; }

.bokeh-a { width: 620px; height: 620px; top: -260px; left: 50%; transform: translateX(-50%); background: radial-gradient(circle, rgba(232,200,117,0.30), transparent 68%); filter: blur(85px); }
.bokeh-b { width: 420px; height: 420px; bottom: -200px; right: -100px; background: radial-gradient(circle, rgba(200,169,110,0.16), transparent 70%); filter: blur(75px); }

.content {
  position: absolute; left: 90px; right: 90px; top: 0; bottom: 92px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
}

.eyebrow {
  margin: 0 0 14px;
  font: 600 13px/1 'Inter', sans-serif;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: rgba(232,200,117,0.75);
}

.stat {
  margin: 0; line-height: 0.9;
  font-family: 'Playfair Display', serif; font-weight: 700;
  font-size: 168px;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(155deg, #F6E2A2 0%, #E8C875 45%, #C8A96E 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 60px rgba(232,200,117,0.5), 0 0 130px rgba(232,200,117,0.26);
  filter: drop-shadow(0 12px 26px rgba(0,0,0,0.45));
}

.stat-label {
  margin: 10px 0 0;
  font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600;
  font-size: 26px; color: #FAF8F3;
}

.subline {
  margin: 16px 0 0; max-width: 620px;
  font: 400 16px/1.5 'Inter', sans-serif;
  color: rgba(250,248,243,0.62);
}
.subline strong { color: rgba(250,248,243,0.85); font-weight: 600; }

.footer-mark { left: 0; right: 0; bottom: 40px; }
.footer-mark .wordmark { font-size: 16px; letter-spacing: 0.22em; }
</style>
</head>
<body>
<div class="canvas">
  <div class="bokeh bokeh-a"></div>
  <div class="bokeh bokeh-b"></div>

  <div class="content">
    <p class="eyebrow">{{EYEBROW}}</p>
    <p class="stat">{{STAT}}</p>
    <p class="stat-label">{{STAT_LABEL}}</p>
    <p class="subline">{{SUBLINE}}</p>
  </div>

  <div class="footer-mark">
    <span class="rule"></span>
    <span class="wordmark">Buchalik Digital</span>
    <span class="url">buchalik-websites.com</span>
  </div>
</div>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
{{BASE_CSS}}

.canvas { width: 1200px; height: 630px; }

.bokeh-a { width: 480px; height: 480px; top: -200px; right: -100px; background: radial-gradient(circle, rgba(232,200,117,0.30), transparent 70%); filter: blur(65px); }
.bokeh-b { width: 380px; height: 380px; bottom: -180px; left: -100px; background: radial-gradient(circle, rgba(150,160,175,0.10), transparent 70%); filter: blur(60px); }
/* Warm pool behind the Buchalik card so its glow has something to lift off. */
.bokeh-c { width: 620px; height: 620px; top: -80px; right: -60px; background: radial-gradient(circle, rgba(232,200,117,0.15), transparent 68%); filter: blur(80px); }

/* 630px is too short to stack, so the two panels sit side by side here.
   The block is centred as a whole and the panels size to their content —
   stretching them to full height would leave the text swimming. */
.stack {
  position: absolute; left: 78px; right: 78px; top: 0; bottom: 104px;
  display: flex; flex-direction: column; justify-content: center; gap: 24px;
}

.eyebrow {
  margin: 0;
  font: 600 13px/1 'Inter', sans-serif;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: rgba(232,200,117,0.7);
}

.columns { display: flex; gap: 30px; align-items: stretch; }
.row { flex: 1; display: flex; flex-direction: column; gap: 12px; }
.row-label {
  font: 600 14px/1 'Inter', sans-serif;
  letter-spacing: 0.2em; text-transform: uppercase;
}

.glass-panel {
  flex: 1; border-radius: 20px; padding: 30px 34px;
  display: flex; flex-direction: column; justify-content: center; gap: 10px;
}

.price {
  margin: 0;
  font-family: 'Playfair Display', serif; font-weight: 700;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.glass-panel.muted .price { font-size: 34px; }
.glass-panel.accent .price { font-size: 42px; }
.price .per {
  font-family: 'Inter', sans-serif; font-weight: 600;
  font-size: 0.36em; letter-spacing: 0.06em;
  color: rgba(250,248,243,0.66);
}

.meta {
  margin: 0;
  font: 400 14px/1.75 'Inter', sans-serif;
}

.footer-mark { left: 0; right: 0; bottom: 44px; }
.footer-mark .wordmark { font-size: 16px; letter-spacing: 0.22em; }
</style>
</head>
<body>
<div class="canvas">
  <div class="bokeh bokeh-a"></div>
  <div class="bokeh bokeh-b"></div>
  <div class="bokeh bokeh-c"></div>

  <div class="stack">
    <p class="eyebrow">{{EYEBROW}}</p>

    <div class="columns">
      <div class="row">
        <span class="row-label">{{LEFT_LABEL}}</span>
        <div class="glass-panel muted">
          <p class="price">{{LEFT_PRICE}}</p>
          <p class="meta">{{LEFT_META}}</p>
        </div>
      </div>

      <div class="row">
        <span class="row-label gold">{{RIGHT_LABEL}}</span>
        <div class="glass-panel accent">
          <p class="price">{{RIGHT_PRICE}}</p>
          <p class="meta">{{RIGHT_META}}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-mark">
    <span class="rule"></span>
    <span class="wordmark">Buchalik Digital</span>
    <span class="url">buchalik-websites.com</span>
  </div>
</div>
</body>
</html>

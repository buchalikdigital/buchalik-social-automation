<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
{{BASE_CSS}}

.canvas { width: 1080px; height: 1080px; }

.bokeh-a { width: 520px; height: 520px; top: -190px; right: -150px; background: radial-gradient(circle, rgba(232,200,117,0.30), transparent 70%); filter: blur(70px); }
.bokeh-b { width: 440px; height: 440px; bottom: -80px; left: -170px; background: radial-gradient(circle, rgba(150,160,175,0.10), transparent 70%); filter: blur(70px); }
/* Warm pool set well off the edge, so it grazes the Buchalik card and gives
   its glass something to catch — sitting directly behind would flood it. */
.bokeh-c { width: 640px; height: 640px; top: 240px; right: -330px; background: radial-gradient(circle, rgba(232,200,117,0.20), transparent 68%); filter: blur(85px); }

.stack {
  position: absolute; left: 80px; right: 80px; top: 0; bottom: 140px;
  display: flex; flex-direction: column; justify-content: center; gap: 28px;
}

.eyebrow {
  margin: 0;
  font: 600 14px/1 'Inter', sans-serif;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: rgba(232,200,117,0.7);
}

.columns { display: flex; gap: 30px; align-items: stretch; }
.row { flex: 1; display: flex; flex-direction: column; gap: 15px; }
.row-label {
  font: 600 15px/1 'Inter', sans-serif;
  letter-spacing: 0.2em; text-transform: uppercase;
}

.glass-panel {
  flex: 1; min-height: 420px;
  border-radius: 24px; padding: 46px 36px;
  display: flex; flex-direction: column; justify-content: center; gap: 26px;
}

.price {
  margin: 0; white-space: nowrap;
  font-family: 'Playfair Display', serif; font-weight: 700;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.glass-panel.muted .price { font-size: 40px; }
.glass-panel.accent .price { font-size: 54px; }
.price .per {
  font-family: 'Inter', sans-serif; font-weight: 600;
  font-size: 0.34em; letter-spacing: 0.06em;
  color: rgba(250,248,243,0.66);
}

.meta {
  margin: 0;
  font: 400 17px/2 'Inter', sans-serif;
}

.footer-mark { left: 0; right: 0; bottom: 72px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="bokeh bokeh-a"></div>
  <div class="bokeh bokeh-b"></div>
  <div class="bokeh bokeh-c"></div>

  <div class="stack">
    <p class="eyebrow">{{EYEBROW}}</p>

    <div class="columns">
      <div class="row">
        <span class="row-label">{{LEFT_LABEL}}</span>
        <div class="glass-panel muted">
          <p class="price">{{LEFT_PRICE}}</p>
          <p class="meta">{{LEFT_META}}</p>
        </div>
      </div>

      <div class="row">
        <span class="row-label gold">{{RIGHT_LABEL}}</span>
        <div class="glass-panel accent">
          <p class="price">{{RIGHT_PRICE}}</p>
          <p class="meta">{{RIGHT_META}}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-mark">
    <span class="rule"></span>
    <span class="wordmark">Buchalik Digital</span>
    <span class="url">buchalik-websites.com</span>
  </div>
</div>
</body>
</html>

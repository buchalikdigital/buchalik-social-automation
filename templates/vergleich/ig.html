<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
{{BASE_CSS}}

.canvas { width: 1080px; height: 1080px; }

.bokeh-a { width: 560px; height: 560px; top: -180px; right: -160px; background: radial-gradient(circle, rgba(232,200,117,0.32), transparent 70%); filter: blur(70px); }
.bokeh-b { width: 460px; height: 460px; bottom: -60px; left: -160px; background: radial-gradient(circle, rgba(200,169,110,0.22), transparent 70%); filter: blur(70px); }

/* Panels are stacked and vertically centred in the area above the footer. */
.stack {
  position: absolute; left: 88px; right: 88px; top: 0; bottom: 132px;
  display: flex; flex-direction: column; justify-content: center; gap: 50px;
}

.eyebrow {
  margin: 0 0 -8px;
  font: 600 14px/1 'Inter', sans-serif;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: rgba(232,200,117,0.7);
}

.row { display: flex; flex-direction: column; gap: 14px; }
.row-label {
  font: 600 16px/1 'Inter', sans-serif;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(250,248,243,0.5);
}
.row-label.gold { color: #E8C875; }

/* Price sits above a short list — full width, so each panel can carry a
   different number of lines (the two sides aren't symmetric on purpose). */
.glass-panel {
  border-radius: 24px; padding: 46px 50px;
  display: flex; flex-direction: column; gap: 18px;
}

/* The agency panel stays deliberately quiet: no gold glow, dimmer border. */
.glass-panel.muted {
  background: linear-gradient(155deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border-color: rgba(245,237,216,0.14);
  box-shadow: 0 16px 40px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.05);
}
.glass-panel.muted::before { background: linear-gradient(90deg, transparent, rgba(245,237,216,0.18), transparent); }

.price {
  margin: 0; white-space: nowrap;
  font-family: 'Playfair Display', serif; font-weight: 700;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.glass-panel.muted .price { font-size: 50px; color: rgba(250,248,243,0.62); }
.glass-panel.accent .price { font-size: 62px; color: #E8C875; }
.price .per {
  font-family: 'Inter', sans-serif; font-weight: 600;
  font-size: 0.32em; letter-spacing: 0.06em;
  color: rgba(250,248,243,0.66);
}

/* Muted list stays quiet — a plain dash, no colour coding as "bad". */
.meta {
  margin: 0;
  font: 400 19px/1.85 'Inter', sans-serif;
  color: rgba(250,248,243,0.5);
}
/* Accent list gets the warmer read: gold-tinted, not just brighter white. */
.glass-panel.accent .meta { color: rgba(238,214,161,0.92); }

.footer-mark { left: 0; right: 0; bottom: 68px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="bokeh bokeh-a"></div>
  <div class="bokeh bokeh-b"></div>

  <div class="stack">
    <p class="eyebrow">{{EYEBROW}}</p>

    <div class="row">
      <span class="row-label">{{LEFT_LABEL}}</span>
      <div class="glass-panel muted">
        <p class="price">{{LEFT_PRICE}}</p>
        <p class="meta">{{LEFT_META}}</p>
      </div>
    </div>

    <div class="row">
      <span class="row-label gold">{{RIGHT_LABEL}}</span>
      <div class="glass-panel accent">
        <p class="price">{{RIGHT_PRICE}}</p>
        <p class="meta">{{RIGHT_META}}</p>
      </div>
    </div>
  </div>

  <div class="footer-mark">
    <span class="rule"></span>
    <span class="wordmark">Buchalik Digital</span>
    <span class="url">buchalik-websites.com</span>
  </div>
</div>
</body>
</html>

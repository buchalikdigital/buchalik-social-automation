<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 700; src: url(data:font/ttf;base64,{{PLAYFAIR_700}}) format('truetype'); }
  @font-face { font-family: 'Playfair Display'; font-style: italic; font-weight: 600; src: url(data:font/ttf;base64,{{PLAYFAIR_ITALIC_600}}) format('truetype'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; src: url(data:font/ttf;base64,{{INTER_600}}) format('truetype'); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  .canvas {
    position: relative; overflow: hidden;
    width: 1080px; height: 1080px;
    background:
      radial-gradient(circle at 82% 8%, rgba(232,200,117,0.16), transparent 42%),
      linear-gradient(165deg, #211D15, #131009);
    font-family: 'Inter', sans-serif;
  }

  .bokeh { position: absolute; border-radius: 50%; pointer-events: none; }
  .bokeh-a { width: 560px; height: 560px; top: -180px; right: -160px; background: radial-gradient(circle, rgba(232,200,117,0.32), transparent 70%); filter: blur(70px); }
  .bokeh-b { width: 420px; height: 420px; bottom: 40px; left: -140px; background: radial-gradient(circle, rgba(200,169,110,0.22), transparent 70%); filter: blur(65px); }
  .bokeh-c { width: 220px; height: 220px; top: 46%; right: 6%; background: radial-gradient(circle, rgba(245,237,216,0.10), transparent 70%); filter: blur(45px); }

  .glass-panel {
    position: absolute; left: 100px; right: 100px; top: 260px; bottom: 260px; border-radius: 26px; padding: 0 60px;
    display: flex; flex-direction: column; justify-content: center;
    background: linear-gradient(155deg, rgba(255,255,255,0.09), rgba(232,200,117,0.05) 55%, rgba(255,255,255,0.02));
    -webkit-backdrop-filter: blur(28px) saturate(1.4);
    backdrop-filter: blur(28px) saturate(1.4);
    border: 1px solid rgba(232,200,117,0.32);
    box-shadow: 0 24px 60px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.08), inset 0 0 70px rgba(232,200,117,0.05);
  }
  .glass-panel::before {
    content: ""; position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232,200,117,0.65), transparent);
  }

  .headline {
    margin: 0; color: #FAF8F3;
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: 56px; line-height: 1.2;
    text-wrap: balance;
  }
  .headline em { font-style: italic; font-weight: 600; color: #E8C875; }

  .footer-mark {
    position: absolute; left: 0; right: 0; bottom: 80px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .footer-mark .rule { width: 46px; height: 1px; background: linear-gradient(90deg, transparent, rgba(232,200,117,0.7), transparent); }
  .footer-mark .wordmark { font: 600 19px/1 'Inter', sans-serif; letter-spacing: 0.30em; text-transform: uppercase; color: #E8C875; }
  .footer-mark .url { font: 400 14px/1 'Inter', sans-serif; letter-spacing: 0.04em; color: rgba(245,237,216,0.62); }
</style>
</head>
<body>
<div class="canvas ig">
  <div class="bokeh bokeh-a"></div>
  <div class="bokeh bokeh-b"></div>
  <div class="bokeh bokeh-c"></div>
  <div class="glass-panel">
    <p class="headline">{{HEADLINE}}</p>
  </div>
  <div class="footer-mark">
    <span class="rule"></span>
    <span class="wordmark">Buchalik Digital</span>
    <span class="url">buchalik-websites.com</span>
  </div>
</div>
</body>
</html>
